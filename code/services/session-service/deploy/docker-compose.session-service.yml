services:
  session-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: livepilot/session-service:latest
    container_name: livepilot-session-service
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3004"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?Missing DATABASE_URL for session-service}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      NATS_URL: ${NATS_URL:-nats://livepilot-nats:4222}
      NATS_TOKEN: ${NATS_TOKEN:?Missing NATS_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Expose only to localhost/internal mesh for health checks and private routing
      - "127.0.0.1:3004:3004"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - livepilot
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  livepilot:
    name: livepilot-infra
    external: true
