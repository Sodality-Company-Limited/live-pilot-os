openapi: 3.1.0
info:
  title: LivePilot OS Core API Contract
  version: 1.0.0
  description: >-
    Draft HTTP transport contract for the LivePilot OS boundary. It becomes
    generated/canonical only after operation-catalog reconciliation:
    Next.js Frontend <-> Next.js BFF <-> CORE BFF <-> Core Microservices.
    Domain rules remain owned by the responsible microservice; this document defines
    transport schemas, auth, correlation, idempotency, and public error semantics.
tags:
  - name: Authentication
  - name: Live Sessions
  - name: Promotions
paths:
  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Sign in as a seeded test user in local or simulated mode
      operationId: loginTestUser
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated test user and created session
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/session:
    get:
      tags: [Authentication]
      summary: Get the current authenticated test session
      operationId: getCurrentAuthSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current authenticated principal and session scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current test session
      operationId: logoutTestUser
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/live-sessions/{session_id}/overview:
    get:
      tags: [Live Sessions]
      summary: Get the host and operator overview for a live session
      operationId: getLiveSessionOverview
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Live session overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveSessionOverview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/live-sessions/{session_id}/promotions:
    post:
      tags: [Promotions]
      summary: Propose a promotion for policy evaluation and controlled execution
      operationId: proposePromotion
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromotionProposalRequest'
      responses:
        '202':
          description: Proposal accepted for policy evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionProposalResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/PolicyRejected'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/live-sessions/{session_id}/events:
    get:
      tags: [Live Sessions]
      summary: Stream authorized live-session events over SSE
      operationId: streamLiveSessionEvents
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string, maxLength: 128}
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RealtimeEvent'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Replay cursor expired
          content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetails'}}}

  /v1/promotions/{promotion_id}/decision:
    post:
      tags: [Promotions]
      summary: Approve or reject a pending promotion
      operationId: decidePromotion
      security:
        - cookieAuth: []
      parameters:
        - name: promotion_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromotionDecisionRequest'}
      responses:
        '202':
          description: Decision committed; simulated execution is asynchronous
          content: {application/json: {schema: {$ref: '#/components/schemas/PromotionDecisionResponse'}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/PolicyRejected'}
        '503': {$ref: '#/components/responses/Internal'}

  /v1/promotions/{promotion_id}:
    get:
      tags: [Promotions]
      summary: Read promotion and simulated execution state
      operationId: getPromotion
      security:
        - cookieAuth: []
      parameters:
        - name: promotion_id
          in: path
          required: true
          schema: {type: string, minLength: 1}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Promotion state
          content: {application/json: {schema: {$ref: '#/components/schemas/Promotion'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /v1/live-sessions/{session_id}/actions:
    get:
      tags: [Live Sessions]
      summary: Read the authorized immutable action log
      operationId: getActionLog
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Ordered action receipts
          content: {application/json: {schema: {$ref: '#/components/schemas/ActionLogPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: livepilot_session
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      additionalProperties: false
    LoginResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSession'
      additionalProperties: false
    AuthUser:
      type: object
      required: [user_id, role, display_name]
      properties:
        user_id:
          type: string
        role:
          type: string
          enum: [HOST, LIVE_OPS]
        display_name:
          type: string
      additionalProperties: false
    AuthSession:
      type: object
      required: [session_id, user_id, role, mode]
      properties:
        session_id:
          type: string
        user_id:
          type: string
        role:
          type: string
          enum: [HOST, LIVE_OPS]
        live_session_id:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
        mode:
          type: string
          enum: [local, simulated]
      additionalProperties: false
    LiveSessionOverview:
      type: object
      required: [session_id, status, top_products, host_alerts, copilot]
      properties:
        session_id:
          type: string
        status:
          type: string
          enum: [scheduled, live, ended, paused]
        top_products:
          type: array
          items:
            $ref: '#/components/schemas/TopProduct'
        host_alerts:
          type: array
          items:
            $ref: '#/components/schemas/HostAlert'
        copilot:
          $ref: '#/components/schemas/CopilotSuggestion'
      additionalProperties: false
    TopProduct:
      type: object
      required: [product_id, name, interest_count, stock_status]
      properties:
        product_id:
          type: string
        name:
          type: string
        interest_count:
          type: integer
          minimum: 0
        stock_status:
          type: string
          enum: [available, low, out_of_stock, unknown]
      additionalProperties: false
    HostAlert:
      type: object
      required: [alert_id, severity, message]
      properties:
        alert_id:
          type: string
        severity:
          type: string
          enum: [info, warning, high, critical]
        message:
          type: string
      additionalProperties: false
    CopilotSuggestion:
      type: object
      required: [suggestion_id, text, status]
      properties:
        suggestion_id:
          type: string
        text:
          type: string
        status:
          type: string
          enum: [pending, approved, edited, dismissed]
      additionalProperties: false
    PromotionProposalRequest:
      type: object
      required: [product_id, promotion_type, discount_percent, claim_limit]
      properties:
        product_id:
          type: string
        promotion_type:
          type: string
          enum: [FLASH_VOUCHER, PRODUCT_PIN]
        discount_percent:
          type: integer
          minimum: 0
          maximum: 100
        claim_limit:
          type: integer
          minimum: 1
      additionalProperties: false
    PromotionProposalResponse:
      type: object
      required: [promotion_id, status, margin, inventory, next_action]
      properties:
        promotion_id:
          type: string
        status:
          type: string
          enum: [PENDING_POLICY, PENDING_APPROVAL, APPROVED, REJECTED, EXECUTED]
        margin:
          $ref: '#/components/schemas/MarginResult'
        inventory:
          $ref: '#/components/schemas/InventoryReservationResult'
        next_action:
          type: string
      additionalProperties: false
    MarginResult:
      type: object
      required: [result, calculated_margin_bps, minimum_margin_bps]
      properties:
        result:
          type: string
          enum: [APPROVED, NEEDS_APPROVAL, REJECTED]
        calculated_margin_bps:
          type: integer
        minimum_margin_bps:
          type: integer
        policy_version:
          type: string
      additionalProperties: false
    InventoryReservationResult:
      type: object
      required: [reservation_id, status, quantity]
      properties:
        reservation_id:
          type: string
        status:
          type: string
          enum: [RESERVED, RELEASED, COMMITTED, FAILED]
        quantity:
          type: integer
          minimum: 0
      additionalProperties: false
    RealtimeEvent:
      $ref: './schemas/realtime-event.schema.json'
    Promotion:
      $ref: './schemas/promotion.schema.json'
    PromotionDecisionRequest:
      type: object
      required: [decision, expected_resource_version, reason]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        expected_resource_version:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      additionalProperties: false
    PromotionDecisionResponse:
      type: object
      required: [promotion_id, decision_id, status, resource_version, action_id]
      properties:
        promotion_id: {type: string}
        decision_id: {type: string}
        status:
          type: string
          enum: [approved, rejected, pending, unknown]
        resource_version: {type: integer, minimum: 1}
        action_id: {type: [string, 'null']}
      additionalProperties: false
    ActionReceipt:
      $ref: './schemas/action-receipt.schema.json'
    ActionLogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/ActionReceipt'}
        next_cursor:
          type: [string, 'null']
      additionalProperties: false
    InvalidParam:
      type: object
      required:
        - name
        - reason
      properties:
        name:
          type: string
        reason:
          type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - symbol
        - message_key
        - request_id
        - correlation_id
        - retry_policy
        - invalid_params
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          pattern: '^LP[0-9]{5}$'
        symbol:
          type: string
        message_key:
          type: string
        request_id:
          type: string
        correlation_id:
          type: string
        retry_policy:
          type: string
          enum: [never, retry, retry_after, reconcile, request_new_credential]
        retry_after_seconds:
          type: integer
          minimum: 0
          nullable: true
        invalid_params:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
      additionalProperties: false
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited:
      description: Too many login attempts
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Idempotency or state conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    PolicyRejected:
      description: Domain policy rejected the proposal
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Internal:
      description: Unexpected internal error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
