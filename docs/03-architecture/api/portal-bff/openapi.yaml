openapi: 3.1.0
info:
  title: LivePilot Portal BFF API
  version: 1.0.0
  description: Browser-only same-origin contract. Domain ownership remains in Core BFF and services.
servers:
  - url: /
paths:
  /api/auth/login:
    post:
      operationId: loginTestUser
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../openapi.yaml#/components/schemas/LoginRequest'}}}
      responses:
        '200': {description: Authenticated session}
        '400': {description: Invalid request}
        '401': {description: Invalid credentials}
        '429': {description: Rate limited}
  /api/auth/session:
    get:
      operationId: getCurrentAuthSession
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current session}, '401': {description: Unauthorized}}
  /api/auth/logout:
    post:
      operationId: logoutTestUser
      security: [{cookieAuth: []}]
      responses: {'204': {description: Revoked}, '401': {description: Unauthorized}}
  /api/live-sessions/{session_id}/overview:
    get:
      operationId: getLiveSessionOverview
      security: [{cookieAuth: []}]
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Overview}, '401': {description: Unauthorized}, '404': {description: Not found}}
  /api/live-sessions/{session_id}/events:
    get:
      operationId: streamLiveSessionEvents
      security: [{cookieAuth: []}]
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}, {name: Last-Event-ID, in: header, schema: {type: string}}]
      responses: {'200': {description: SSE stream, content: {text/event-stream: {schema: {$ref: '../openapi.yaml#/components/schemas/RealtimeEvent'}}}}}
  /api/live-sessions/{session_id}/promotions:
    post:
      operationId: proposePromotion
      security: [{cookieAuth: []}]
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Proposal pending}, '401': {description: Unauthorized}, '422': {description: Policy rejected}}
  /api/promotions/{promotion_id}/decision:
    post:
      operationId: decidePromotion
      security: [{cookieAuth: []}]
      parameters: [{name: promotion_id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      responses: {'202': {description: Decision accepted}, '403': {description: Forbidden}, '409': {description: Conflict}}
  /api/promotions/{promotion_id}:
    get:
      operationId: getPromotion
      security: [{cookieAuth: []}]
      parameters: [{name: promotion_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Promotion}, '404': {description: Not found}}
  /api/live-sessions/{session_id}/actions:
    get:
      operationId: getActionLog
      security: [{cookieAuth: []}]
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Action log}, '403': {description: Forbidden}}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: livepilot_session}
