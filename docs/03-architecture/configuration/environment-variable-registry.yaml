schema_version: "1"
status: canonical_template
owner: platform-engineering
rules:
  - required values fail startup with a safe diagnostic
  - secrets never appear in logs, fixtures, or Git
  - unknown keys warn in local and fail in staging/production
  - production changes require approval and an audit receipt
variables:
  - key: APP_ENV
    type: enum
    allowed: [local, ci, prod]
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: DEMO_MODE
    type: boolean
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: DEMO_SCENARIO
    type: enum
    allowed: [opportunity, threat]
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: FRONTEND_MOCK_SIGNALS
    type: boolean
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: BACKEND_MOCK_PRODUCTS
    type: boolean
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: PLATFORM_ADAPTER_MODE
    type: enum
    allowed: [simulated, sandbox, production]
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: TIKTOK_LOGIN_ENABLED
    type: boolean
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: TIKTOK_SHOP_ENABLED
    type: boolean
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: RESEND_ENABLED
    type: boolean
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: AI_PROVIDER
    type: enum
    allowed: [fixture, openai]
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: OPENAI_API_KEY
    type: secret
    required: false
    secret: true
    source: secret_manager_or_protected_env
    reload: restart
  - key: OPENAI_MODEL
    type: string
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: JEV_PROMPT_REVISION
    type: string
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: JEV_SCHEMA_REVISION
    type: string
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: DATABASE_URL
    type: uri
    required: true
    secret: true
    source: secret_manager_or_protected_env
    reload: restart
  - key: NATS_URL
    type: uri
    required: true
    secret: false
    source: deployment
    reload: restart
  - key: REDIS_URL
    type: uri
    required: true
    secret: true
    source: secret_manager_or_protected_env
    reload: restart
  - key: OTEL_EXPORTER_OTLP_ENDPOINT
    type: uri
    required: true
    secret: false
    source: deployment
    reload: restart
