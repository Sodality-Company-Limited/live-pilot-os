services:
  edge:
    # Build/pin an image containing nginx, libModSecurity, and OWASP CRS.
    # Do not replace this with plain nginx: that would remove the WAF boundary.
    image: owasp/modsecurity-crs:nginx
    container_name: livepilot-edge
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    ports:
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/modsecurity.conf:/etc/modsecurity.d/livepilot.conf:ro
    secrets:
      - tls_certificate
      - tls_private_key
    networks: [livepilot-infra]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  tls_certificate:
    file: /etc/livepilot/tls/fullchain.pem
  tls_private_key:
    file: /etc/livepilot/tls/privkey.pem

networks:
  livepilot-infra:
    external: true
    name: livepilot-infra
