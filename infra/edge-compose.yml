services:
  edge:
    # Build/pin an image containing nginx, libModSecurity, and OWASP CRS.
    # Do not replace this with plain nginx: that would remove the WAF boundary.
    image: owasp/modsecurity-crs:nginx
    container_name: livepilot-edge
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    ports:
      - "443:8443"
    volumes:
      - /home/livepilot-admin/live-pilot-os/tls:/etc/livepilot/tls:ro
    environment:
      - PORT=8080
      - SSL_PORT=8443
      - BACKEND=http://livepilot-krakend-edge:8080
      - SSL_CERT_FILE=/etc/livepilot/tls/fullchain.pem
      - SSL_CERT_KEY_FILE=/etc/livepilot/tls/privkey.pem
      - NGINX_ALWAYS_TLS_REDIRECT=off
      - SSL_OCSP_STAPLING=off
      - PARANOIA=1
      - ANOMALY_INBOUND=5
      - ANOMALY_OUTBOUND=4
    networks: [livepilot-infra]
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://127.0.0.1:8443/__health || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  livepilot-infra:
    external: true
    name: livepilot-infra
