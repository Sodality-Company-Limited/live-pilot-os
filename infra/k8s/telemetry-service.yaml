apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
  labels:
    app.kubernetes.io/name: telemetry-service
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: livepilot-os
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-service
        app.kubernetes.io/component: domain-service
        app.kubernetes.io/part-of: livepilot-os
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry-service
          image: livepilot/telemetry-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-service-secrets
                  key: NATS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-service-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  labels:
    app.kubernetes.io/name: telemetry-service
    app.kubernetes.io/component: domain-service
    app.kubernetes.io/part-of: livepilot-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
