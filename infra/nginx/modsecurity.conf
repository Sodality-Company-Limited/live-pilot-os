# Loaded by the edge image that provides libModSecurity and OWASP CRS.
# Fail closed if the image is built without the module: the deployment check
# must reject the image rather than silently running without a WAF.
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecAuditEngine RelevantOnly
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHZ
SecStatusEngine Off

Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
