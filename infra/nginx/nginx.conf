worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"request_id":"$request_id"}';
  access_log /var/log/nginx/access.log json;
  error_log  /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=edge_per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=edge_conn_per_ip:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Node 1 is the only public application hop. Node 3/4/5 remain private.
  upstream livepilot_portal_ui { server portal-ui:3000; }

  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req zone=edge_per_ip burst=40 nodelay;
    limit_conn edge_conn_per_ip 40;

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 60s;
      proxy_pass http://livepilot_portal_ui;
    }
  }
}
